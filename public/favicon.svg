<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    rect { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) { rect { stroke: #ffffff; } }
  </style>
  <!-- The header mark: an outlined square turned 45°. -->
  <rect x="8" y="8" width="16" height="16" fill="none" stroke-width="3" transform="rotate(45 16 16)" />
</svg>
