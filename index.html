<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <!-- Dark by default; applies a saved light choice before first paint so the
         page never flashes the wrong theme. Key and default match src/hooks/useTheme.ts. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.dataset.theme = 'light'
          document.querySelector('meta[name="theme-color"]').content = '#ffffff'
        }
      } catch (error) {
        // Storage unavailable: stay on the default theme.
      }
    </script>
    <title>Animesh Mitra — Software Developer</title>
    <meta
      name="description"
      content="Animesh Mitra, software developer: mobile apps with React Native and Expo, interactive 3D with React Three Fiber, and the API integrations behind them."
    />

    <!-- Link previews (LinkedIn, Slack, WhatsApp, X). Add og:url and og:image
         with absolute URLs once the site has its own domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Animesh Mitra" />
    <meta property="og:title" content="Animesh Mitra — Software Developer" />
    <meta
      property="og:description"
      content="Mobile apps, interactive 3D and the API integrations behind them. Selected work, experience and contact."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
